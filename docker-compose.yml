networks:
  custom-tailnet:
    driver: bridge

services:
  # Traefik Reverse Proxy (optional — enable with --profile proxy)
  traefik:
    image: traefik:v3.4
    restart: always
    profiles:
      - proxy
    ports:
      - '80:80'
      - '443:443'
    networks:
      - custom-tailnet
    command:
      - --configFile=/etc/traefik/traefik.yaml
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - ./traefik.yaml:/etc/traefik/traefik.yaml
      - ./acme.json:/etc/traefik/acme.json
      - ./dynamic:/etc/traefik/dynamic

  # Dynamic traefik config generator (optional — enable with --profile proxy).
  # Image is the original dflow-sh build; the upstream repo is archived but
  # the image remains published on ghcr.
  config-generator:
    image: ghcr.io/dflow-sh/config-generator:latest
    networks:
      - custom-tailnet
    restart: on-failure
    profiles:
      - proxy
    environment:
      - JWT_TOKEN=${JWT_TOKEN}
      - WILD_CARD_DOMAIN=${WILD_CARD_DOMAIN}
      - PROXY_PORT=${PROXY_PORT}
    volumes:
      - ./dynamic:/app/output

  # Monitoring dashboard (optional — enable with --profile monitoring)
  beszel:
    image: henrygd/beszel:latest
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - custom-tailnet
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket

  # Monitoring beszel-agent
  beszel-agent:
    image: henrygd/beszel-agent
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - custom-tailnet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: '<beszel-ssh-key>'
      TOKEN: '<token>'
      HUB_URL: http://beszel:8090

  # Redis
  redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - custom-tailnet
    volumes:
      - redis-data:/data

  # MongoDB
  mongodb:
    image: mongo:7
    restart: unless-stopped
    networks:
      - custom-tailnet
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db

  # Payload CMS App
  payload-app:
    image: ${DFLOW_IMAGE:-ghcr.io/dvorinka/dflow:latest}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    networks:
      - custom-tailnet
    ports:
      - '${APP_PORT:-3000}:3000'
    restart: always
    depends_on:
      - redis
      - mongodb
    environment:
      NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL}
      DATABASE_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB_NAME}?authSource=admin
      REDIS_URI: redis://redis:6379
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      TAILSCALE_AUTH_KEY: ${TAILSCALE_AUTH_KEY}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${TAILSCALE_OAUTH_CLIENT_SECRET}
      TAILSCALE_TAILNET: ${TAILSCALE_TAILNET}
      TAILSCALE_LOGIN_SERVER: ${TAILSCALE_LOGIN_SERVER:-}
      ZEROTIER_API_URL: ${ZEROTIER_API_URL:-}
      ZEROTIER_API_TOKEN: ${ZEROTIER_API_TOKEN:-}
      ZEROTIER_NETWORK_ID: ${ZEROTIER_NETWORK_ID:-}
      NEXT_PUBLIC_PROXY_DOMAIN_URL: ${NEXT_PUBLIC_PROXY_DOMAIN_URL}
      NEXT_PUBLIC_BETTER_STACK_SOURCE_TOKEN: ${NEXT_PUBLIC_BETTER_STACK_SOURCE_TOKEN}
      NEXT_PUBLIC_BETTER_STACK_INGESTING_URL: ${NEXT_PUBLIC_BETTER_STACK_INGESTING_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_SENDER_EMAIL: ${RESEND_SENDER_EMAIL}
      RESEND_SENDER_NAME: ${RESEND_SENDER_NAME}
      NEXT_PUBLIC_PROXY_CNAME: ${NEXT_PUBLIC_PROXY_CNAME}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-}
      NEXT_PUBLIC_TELEMETRY_DISABLED: ${NEXT_PUBLIC_TELEMETRY_DISABLED:-}
      NEXT_PUBLIC_AUTH_SYNC_DOMAINS: ${NEXT_PUBLIC_AUTH_SYNC_DOMAINS:-}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_WEBHOOK_URL: ${NEXT_PUBLIC_WEBHOOK_URL:-}
      AUTH_METHOD: ${AUTH_METHOD:-}
      SERVER_DETAILS_CACHE_TTL: ${SERVER_DETAILS_CACHE_TTL:-}
      NETBIRD_API_URL: ${NETBIRD_API_URL:-}
      NETBIRD_API_TOKEN: ${NETBIRD_API_TOKEN:-}
      NETBIRD_MANAGEMENT_URL: ${NETBIRD_MANAGEMENT_URL:-}
      BESZEL_MONITORING_URL: ${BESZEL_MONITORING_URL:-}
      BESZEL_SUPERUSER_EMAIL: ${BESZEL_SUPERUSER_EMAIL:-}
      BESZEL_SUPERUSER_PASSWORD: ${BESZEL_SUPERUSER_PASSWORD:-}
      BESZEL_HUB_SSHKEY: ${BESZEL_HUB_SSHKEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./scripts:/app/scripts

volumes:
  mongo-data:
  redis-data:
