name: Bug report
description: Something broken in this fork
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro steps + expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redact secrets)
